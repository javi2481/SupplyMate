schema: spec-driven

context: |
  Project: SupplyMate — AI replenishment advisor for SME distributors.
  Stack: Python 3.12, FastAPI, Pydantic, openai-agents, CSV, pytest, Vite/React (Lovable frontend).
  Architecture: LLM orchestrates tools; deterministic Python calculates order qty.
  Product: FastAPI + Lovable Explore/Build PO UI (chat + slice dashboard + purchase CSV).
  Shared metrics vocabulary. No Superset/DuckDB. Streamlit is retired (not a product surface).
  Out of scope: RAG, embeddings, LangChain, multi-agent swarm, Postgres/dbt/Airflow, K8s, Apache Superset.

strict_tdd: true

testing:
  runner: pytest
  command: pytest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage: true

rules:
  proposal:
    - Keep MVP scope minimal; no RAG or multi-agent
    - Prefer UX coherence over number of components
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - LLM must not invent critical numbers; quantity from Python only
    - Chart granularity follows recorte shape (category → subcategory → top SKUs), not hardcoded rubros
  tasks:
    - Order tasks for Strict TDD
    - Group by phase, hierarchical numbering
  apply:
    - Follow Strict TDD RED-GREEN-TRIANGULATE-REFACTOR per task
  verify:
    - Require TDD evidence table and green pytest without live LLM
