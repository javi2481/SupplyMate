schema: spec-driven

context: |
  Project: SupplyMate — AI replenishment advisor for SME distributors.
  Stack: Python 3.12, FastAPI, Pydantic, openai-agents, CSV, pytest, Streamlit.
  Architecture: LLM orchestrates tools; deterministic Python calculates order qty.
  Product: one Streamlit chat — “¿Cuánto pedir?” and “¿Qué está pasando?” in the same reply
  (KPIs + lollipop/histogram + purchase table). Shared metrics vocabulary. No Superset/DuckDB.
  Out of scope: RAG, embeddings, LangChain, multi-agent, React frontend, Postgres/dbt/Airflow, K8s, Apache Superset.

strict_tdd: true

testing:
  runner: pytest
  command: pytest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage: false

rules:
  proposal:
    - Keep MVP scope minimal; no RAG or multi-agent
    - Prefer UX coherence over number of components
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - LLM must not invent critical numbers; quantity from Python only
    - Chart type follows data-to-viz: ranking → lollipop; numeric distribution → histogram
  tasks:
    - Order tasks for Strict TDD
    - Group by phase, hierarchical numbering
  apply:
    - Follow Strict TDD RED-GREEN-TRIANGULATE-REFACTOR per task
  verify:
    - Require TDD evidence table and green pytest without live LLM
