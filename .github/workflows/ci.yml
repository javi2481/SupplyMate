name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        env:
          SUPPLYMATE_ENV: test
          GROQ_API_KEY: test-groq-key
          LLM_PROVIDER: groq
          OPENAI_AGENTS_DISABLE_TRACING: "1"
        run: |
          pytest \
            --cov=app.core.replenishment \
            --cov=app.services.scoping.mutations \
            --cov=app.services.analytics.catalog_service \
            --cov=app.services.analytics.dashboard \
            --cov=app.pipeline.query_interpretation \
            --cov=app.pipeline.reference_resolver \
            --cov=app.guidance.engine \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not performance and not llm"
      - name: pip-audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test API container
        run: |
          docker build -t supplymate-ci .
          docker run -d --name supplymate-smoke -p 8000:8000 \
            -e SUPPLYMATE_ENV=test \
            -e GROQ_API_KEY=test-groq-key \
            supplymate-ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          bash scripts/smoke_api.sh
          docker stop supplymate-smoke

  performance:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Performance smoke
        env:
          SUPPLYMATE_ENV: test
          GROQ_API_KEY: test-groq-key
          LLM_PROVIDER: groq
        run: pytest -m performance
