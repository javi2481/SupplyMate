name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "data/**"
      - ".env.example"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "data/**"
      - ".env.example"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Run pytest with coverage
        env:
          SUPPLYMATE_ENV: test
          GROQ_API_KEY: test-groq-key
          LLM_PROVIDER: groq
          OPENAI_AGENTS_DISABLE_TRACING: "1"
        run: |
          pytest -n 2 \
            --durations=20 \
            --cov=app.core.replenishment \
            --cov=app.services.scoping.mutations \
            --cov=app.services.analytics.catalog_service \
            --cov=app.services.analytics.dashboard \
            --cov=app.pipeline.query_interpretation \
            --cov=app.pipeline.reference_resolver \
            --cov=app.guidance.engine \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not performance and not llm and not combinatorial_full"
      - name: pip-audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test API container
        run: |
          docker build -t supplymate-ci .
          docker run -d --name supplymate-smoke -p 8000:8000 \
            -e SUPPLYMATE_ENV=test \
            -e GROQ_API_KEY=test-groq-key \
            supplymate-ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          bash scripts/smoke_api.sh
          docker stop supplymate-smoke

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Performance smoke
        env:
          SUPPLYMATE_ENV: test
          GROQ_API_KEY: test-groq-key
          LLM_PROVIDER: groq
        run: pytest -m performance
