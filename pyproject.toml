[project]
name = "supplymate"
version = "0.1.0"
description = "AI replenishment advisor — LLM orchestrates, deterministic code decides"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "streamlit>=1.38.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
