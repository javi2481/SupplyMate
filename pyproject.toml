[project]
name = "supplymate"
version = "0.1.0"
description = "AI replenishment advisor — LLM orchestrates, deterministic code decides"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.9.0",
]
e2e = [
  "playwright>=1.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "performance: performance smoke tests (may run on main CI only)",
  "llm: live Groq evals (skipped in CI; requires RUN_LLM_EVALS=1)",
  "combinatorial_full: full cartesian recorte contracts (opt-in; excluded from default CI)",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
include = [
  "app/core/replenishment.py",
  "app/services/scoping/mutations.py",
  "app/services/analytics/catalog_service.py",
  "app/services/analytics/dashboard.py",
  "app/pipeline/query_interpretation.py",
  "app/pipeline/reference_resolver.py",
  "app/guidance/engine.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",  # FastAPI Query/Depends defaults
]
